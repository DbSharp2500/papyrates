<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report — Papyrates</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:Georgia,serif;background:#1a1408;display:flex;flex-direction:column;}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #4a3820;background:#221a0c;}
.bar .name{flex:1;color:#d4a96a;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);color:#a08050;border:1px solid #4a3820;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-family:Georgia,serif;text-decoration:none;white-space:nowrap;}
.btn:hover{background:rgba(255,255,255,0.14);color:#d4a96a;}
.msg{color:#8a7050;font-size:14px;padding:28px 20px;line-height:1.6;max-width:640px;}
iframe{flex:1;width:100%;border:0;background:#fff;}
pre{flex:1;overflow:auto;color:#cbb994;font-size:12px;line-height:1.5;padding:14px 16px;white-space:pre-wrap;word-break:break-word;}
/* review bar + sheet */
#rv-bar{order:99;display:none;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid #6a5030;background:#2a2010;}
#rv-bar span{color:#d4a96a;font-size:13px;}
#rv-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:10;}
#rv-ov.show{display:flex;}
.rv-sheet{background:#2a2010;border:1px solid #6a5030;border-radius:14px 14px 0 0;width:100%;max-width:700px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;}
.rv-list{overflow:auto;flex:1 1 auto;padding:16px 16px 8px;}
.rv-foot{flex:0 0 auto;padding:10px 16px 14px;border-top:1px solid #6a5030;background:#2a2010;}
.rv-sheet h3{color:#d4a96a;font-size:14px;font-weight:normal;margin:0 0 8px;letter-spacing:.5px;line-height:1.4;}.rv-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #3a2c16;font-size:13px;color:#cbb994;line-height:1.45;}
.rv-item input{width:20px;height:20px;margin-top:2px;accent-color:#d4a96a;flex-shrink:0;}
.rv-tag{font-size:11px;color:#8a7050;display:block;margin-bottom:2px;}
.rv-btns{display:flex;gap:8px;flex-wrap:nowrap;}
.rv-btns button,.rv-comp button{flex:1;min-width:0;padding:11px;border-radius:8px;font-size:14px;font-family:Georgia,serif;cursor:pointer;border:1px solid #6a5030;background:transparent;color:#d4a96a;}
.rv-btns button.primary{flex:2.2;}
.rv-btns button.primary,.rv-comp button.primary{background:#d4a96a;color:#1a1408;border-color:#d4a96a;font-weight:bold;}
.rv-comp{margin-top:18px;padding-top:14px;border-top:1px solid #6a5030;font-size:13px;color:#a08a60;line-height:1.5;}
.rv-comp button{width:100%;margin-top:8px;}
.rv-msg{font-size:12px;color:#d4a96a;margin-top:10px;}
.rv-close{display:block;margin:8px auto 0;background:none;border:0;color:#8a7050;font-size:13px;text-decoration:underline;cursor:pointer;font-family:Georgia,serif;}
</style>
</head>
<body>
<div class="bar">
  <a class="btn" href="/reports.html">&#8592; Reports</a>
  <div class="name" id="name"></div>
  <a class="btn" href="/">&#8962; Home</a>
</div>
<div class="msg" id="msg">Loading&hellip;</div>
<div id="rv-bar"><span id="rv-text"></span><button class="btn" onclick="openReview()">Review &#9656;</button></div>
<div id="rv-ov"><div class="rv-sheet" id="rv-sheet"></div></div>

<script src="/papyrates-auth.js"></script>
<script>
requireAuth('research');

const KEY_RE = /^(claude|gpt|gemini|judge)\/[A-Za-z0-9._-]{1,180}\.(html|log|pdf)$/;
const key = new URLSearchParams(location.search).get('f') || '';
const msg = document.getElementById('msg');
document.getElementById('name').textContent = key.replace(/^[a-z]+\//, '');

// Same naming rule the server uses for stored files.
function safeName(n) { return String(n || '').replace(/[^A-Za-z0-9._-]/g, '_').replace(/\.{2,}/g, '.').replace(/^\.+/, '_').slice(0, 180); }

// A report may link to another report by its old local path (file:///C:/Users/.../Papyrates AI summaries/Claude Discussions/x.html).
// Turn those into links to this viewer; everything else opens in a new tab.
function fixLinks(doc) {
  doc.querySelectorAll('a[href]').forEach(function (a) {
    const h = a.getAttribute('href') || '';
    const m = /^file:\/\/\/.*Papyrates(?:%20|\s)AI(?:%20|\s)summaries\/([^\/]+)\/([^?#]+)/i.exec(h);
    if (m) {
      let folder, name;
      try { folder = decodeURIComponent(m[1]).split(' ')[0].toLowerCase(); name = decodeURIComponent(m[2]); } catch (e) { return; }
      const k = folder + '/' + safeName(name);
      if (KEY_RE.test(k)) { a.setAttribute('href', '/report.html?f=' + encodeURIComponent(k)); a.setAttribute('target', '_blank'); }
    } else if (/^(https?:|mailto:)/i.test(h)) {
      a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer');
    }
  });
}

// The Jims' reports are laid out for a desktop: a main column beside a fixed-width sidebar (<aside>), with no rules for a
// narrow screen - on a phone the text column shrinks to a sliver. On narrow screens only, stack everything in one column.
// (:has(> aside) finds whatever element holds the sidebar, whichever class the Jim's template calls it.)
const PHONE_CSS = '@media (max-width: 820px) {' +
  'header { display: flex !important; flex-wrap: wrap !important; align-items: baseline !important; gap: 6px 14px !important; padding: 16px 14px !important; }' +
  'header > * { flex: 0 1 auto !important; min-width: 0 !important; margin-left: 0 !important; text-align: left !important; }' +
  'header h1 { flex: 1 1 100% !important; font-size: 19px !important; line-height: 1.3 !important; }' +
  ':has(> aside) { display: block !important; grid-template-columns: minmax(0, 1fr) !important; gap: 0 !important; padding: 16px 12px !important; }' +
  ':has(> aside) > main, :has(> aside) > aside { width: 100% !important; max-width: 100% !important; min-width: 0 !important; float: none !important; position: static !important; margin-left: 0 !important; margin-right: 0 !important; }' +
  'aside { margin-top: 18px !important; }' +
  'html, body { max-width: 100% !important; overflow-x: hidden !important; }' +
  'main, aside, section, header, div, p, li, td, th { overflow-wrap: anywhere; }' +
  'img, svg, video, iframe { max-width: 100% !important; height: auto; }' +
  'pre, code { white-space: pre-wrap !important; word-break: break-word; }' +
  'table { display: block; max-width: 100%; overflow-x: auto; }' +
  '}';

async function show() {
  if (!KEY_RE.test(key)) { msg.textContent = 'That is not a valid report name.'; return; }
  let res;
  try {
    res = await fetch('/api/reports?f=' + encodeURIComponent(key), { headers: { Authorization: 'Bearer ' + getPapyratesToken() } });
  } catch (e) { msg.textContent = 'Could not reach the site. Check your connection.'; return; }
  if (res.status === 401) { clearPapyratesSession(); window.location.href = '/index.html'; return; }
  if (res.status === 404) { msg.textContent = 'This report is not in the cloud yet. The Desktop copies new reports every couple of minutes, so try again shortly. (Older reports are copied the first time the Desktop syncs.)'; return; }
  if (!res.ok) { msg.textContent = 'Could not load the report (' + res.status + ').'; return; }

  const ext = key.split('.').pop();
  if (ext === 'html') {
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    fixLinks(doc);
    const st = doc.createElement('style'); st.textContent = PHONE_CSS; (doc.head || doc.documentElement).appendChild(st);   // last, so it wins
    msg.remove();
    const f = document.createElement('iframe');
    // Scripts inside a report may run (many reports have expand/collapse code) but WITHOUT allow-same-origin,
    // so the report is walled off from this site: it cannot read your login or call the site as you.
    f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox');
    f.srcdoc = '<!DOCTYPE html>' + doc.documentElement.outerHTML;
    document.body.appendChild(f);
  } else if (ext === 'log') {
    msg.remove();
    const p = document.createElement('pre'); p.textContent = await res.text(); document.body.appendChild(p);
  } else {
    const url = URL.createObjectURL(await res.blob());
    msg.innerHTML = '';
    const a = document.createElement('a'); a.className = 'btn'; a.href = url; a.target = '_blank'; a.textContent = 'Open the PDF';
    msg.appendChild(a);
  }
}
show();

// ---- review panel: the Jims' suggested memories etc., and "make this comparative" ----
// A link from the Ask page carries the question (?r= a research request and/or ?q= a comparative question). A report
// opened from the Reports list does not, so the site works out which question it answered from the report's name.
const qp = new URLSearchParams(location.search);
let RID = /^\d{1,9}$/.test(qp.get('r') || '') ? qp.get('r') : null;
let QID = /^\d{1,9}$/.test(qp.get('q') || '') ? qp.get('q') : null;
const JIM = { claude: 'Claude', gpt: 'GPT', gemini: 'Gemini' };
const CAT = { memory: 'Memory', open_question: 'Open question', contradiction: 'Contradiction' };
let rv = null;

function rvHdrs() { return { 'Authorization': 'Bearer ' + getPapyratesToken(), 'Content-Type': 'application/json' }; }
function rvEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

async function loadReview() {
  if (!getPapyratesToken() || getPapyratesTier() !== 'admin') return;       // the review tools are admin-only
  let url = '/api/proposals?';
  if (RID || QID) url += (RID ? 'request=' + RID + '&' : '') + (QID ? 'question=' + QID : '');
  else url += 'report=' + encodeURIComponent(key);
  let res;
  try { res = await fetch(url, { headers: rvHdrs() }); } catch (e) { return; }
  if (!res.ok) return;
  rv = await res.json();
  if (!RID && rv.request_id) RID = String(rv.request_id);
  if (!QID && rv.question_id) QID = String(rv.question_id);
  const pending = (rv.proposals || []).filter(function (p) { return p.status === 'pending'; });
  const canPromote = !!RID && !rv.promoted_question_id && !QID && rv.results > 0;
  const bar = document.getElementById('rv-bar');
  const bits = [];
  if (pending.length) bits.push(pending.length + ' suggestion' + (pending.length === 1 ? '' : 's') + ' to review');
  if (canPromote) bits.push('make comparative?');
  if (!bits.length) { bar.style.display = 'none'; return; }
  document.getElementById('rv-text').textContent = bits.join(' \u00b7 ');
  bar.style.display = 'flex';
}

function itemText(p) {
  const f = p.fields || {};
  if (p.category === 'memory') return rvEsc(f.content);
  if (p.category === 'open_question') return rvEsc(f.question) + (f.context ? '<br><span class="rv-tag">' + rvEsc(f.context) + '</span>' : '');
  return '<b>Standard account:</b> ' + rvEsc(f.standard_account) + '<br><b>Documents show:</b> ' + rvEsc(f.database_shows) + (f.confidence ? ' <span class="rv-tag">(' + rvEsc(f.confidence) + ' confidence)</span>' : '');
}

function drawReview(msg) {
  const pending = (rv.proposals || []).filter(function (p) { return p.status === 'pending'; });
  let list = '';
  if (pending.length) {
    list += '<h3>Tick the ones to save. Anything you leave unticked is discarded.</h3>' + pending.map(function (p) {
      return '<label class="rv-item"><input type="checkbox" value="' + p.id + '" onchange="rvCount()"><span><span class="rv-tag">' + (JIM[p.ai_model] || p.ai_model) + ' &middot; ' + (CAT[p.category] || p.category) + (p.topic ? ' &middot; ' + rvEsc(p.topic) : '') + '</span>' + itemText(p) + '</span></label>';
    }).join('');
  }
  if (RID && !QID) {
    list += '<div class="rv-comp">' + (rv.promoted_question_id
      ? 'This is now Comparative Question ' + rv.promoted_question_id + '.'
      : (rv.results > 0
        ? '<b>Make this a comparative research question?</b><br>The answers already given are copied into the comparative system, and the Judge starts by itself once all three Jims have answered.<button class="primary" onclick="rvPromote()">Yes, make it comparative</button>'
        : 'A Jim has to finish before this can be made comparative.')) + '</div>';
  }
  if (!list) list = '<h3>Nothing left to review.</h3>';
  const foot = (pending.length ? '<div class="rv-btns"><button id="rv-all" onclick="rvToggleAll()">Select all</button><button class="primary" id="rv-save" onclick="rvSave()">Discard all</button></div>' : '') +
    (msg ? '<div class="rv-msg">' + rvEsc(msg) + '</div>' : '') + '<button class="rv-close" onclick="closeReview()">Close</button>';
  document.getElementById('rv-sheet').innerHTML = '<div class="rv-list">' + list + '</div><div class="rv-foot">' + foot + '</div>';
  rvCount();
}

function rvBoxes() { return Array.prototype.slice.call(document.querySelectorAll('#rv-sheet .rv-item input')); }
// the main button always says exactly what one tap will do
function rvCount() {
  const btn = document.getElementById('rv-save'); if (!btn) return;
  const boxes = rvBoxes(), ticked = boxes.filter(function (b) { return b.checked; }).length, left = boxes.length - ticked;
  btn.textContent = ticked === 0 ? 'Discard all ' + boxes.length
    : (left === 0 ? 'Save all ' + ticked : 'Save ' + ticked + ' \u00b7 discard ' + left);
  document.getElementById('rv-all').textContent = ticked === boxes.length ? 'Clear all' : 'Select all';
}
function rvToggleAll() {
  const boxes = rvBoxes(), all = boxes.every(function (b) { return b.checked; });
  boxes.forEach(function (b) { b.checked = !all; });
  rvCount();
}
function openReview() { drawReview(''); document.getElementById('rv-ov').classList.add('show'); }
function closeReview() { document.getElementById('rv-ov').classList.remove('show'); }

async function rvPost(body) {
  const res = await fetch('/api/proposals', { method: 'POST', headers: rvHdrs(), body: JSON.stringify(body) });
  if (res.status === 401) { clearPapyratesSession(); window.location.href = '/index.html'; return null; }
  return { ok: res.ok, data: await res.json() };
}
// Ticked = saved. Every listed suggestion that is NOT ticked is discarded.
async function rvSave() {
  const boxes = rvBoxes();
  const accept = boxes.filter(function (b) { return b.checked; }).map(function (b) { return Number(b.value); });
  const decline = boxes.filter(function (b) { return !b.checked; }).map(function (b) { return Number(b.value); });
  if (!accept.length && !confirm('Nothing is ticked, so all ' + decline.length + ' suggestion' + (decline.length === 1 ? '' : 's') + ' will be discarded. Continue?')) return;
  const btn = document.getElementById('rv-save'); if (btn) btn.disabled = true;
  let r;
  try { r = await rvPost({ action: 'decide', accept: accept, decline: decline }); } catch (e) { drawReview('Could not reach the site. Nothing was changed.'); return; }
  if (!r) return;
  await loadReview();
  const d = r.data || {}, bits = [];
  if (d.accepted) bits.push('Saved ' + d.accepted);
  if (d.declined) bits.push('discarded ' + d.declined);
  drawReview((bits.length ? bits.join(', ') + '.' : (r.ok ? 'Nothing changed.' : (d.error || 'Could not save.'))) + (d.problems && d.problems.length ? ' ' + d.problems.length + ' could not be saved and are still waiting.' : ''));
}
async function rvPromote() {
  let r;
  try { r = await rvPost({ action: 'promote', request_id: Number(RID) }); } catch (e) { return drawReview('Could not reach the site. Nothing was changed.'); }
  if (!r) return;
  await loadReview();
  drawReview(r.ok ? 'Done \u2014 it is now Comparative Question ' + r.data.question_id + '.' : (r.data.error || 'Could not make it comparative.'));
}
loadReview();
</script>
</body>
</html>
