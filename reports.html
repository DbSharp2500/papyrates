<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Papyrates</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Georgia,serif;background:#1a1408;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.header{width:100%;max-width:760px;padding:24px 20px 0;display:flex;align-items:baseline;justify-content:space-between;}
.header h1{color:#d4a96a;font-size:20px;font-weight:normal;letter-spacing:1px;}
.home-btn{background:rgba(255,255,255,0.08);color:#a08050;border:1px solid #4a3820;padding:6px 14px;border-radius:6px;font-size:13px;font-family:Georgia,serif;text-decoration:none;}
.home-btn:hover{background:rgba(255,255,255,0.14);color:#d4a96a;}
.tools{width:100%;max-width:760px;padding:16px 20px 0;display:flex;gap:8px;flex-wrap:wrap;}
.tab{background:rgba(255,255,255,0.05);color:#a08050;border:1px solid #4a3820;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-family:Georgia,serif;}
.tab.on{color:#d4a96a;border-color:#8a6a3a;background:rgba(212,169,106,0.1);}
.search{flex:1;min-width:160px;background:#2a2010;border:1px solid #4a3820;color:#d4a96a;padding:6px 10px;border-radius:6px;font-size:13px;font-family:Georgia,serif;}
.list{width:100%;max-width:760px;padding:14px 20px 40px;display:flex;flex-direction:column;gap:8px;}
.item{background:#2a2010;border:1px solid #4a3820;border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
.item .t{flex:1;min-width:200px;font-size:13px;color:#d4a96a;word-break:break-word;}
.item .d{font-size:11px;color:#6a5a40;}
.item a{font-size:12px;color:#a08050;border:1px solid #4a3820;border-radius:5px;padding:3px 9px;text-decoration:none;}
.item a:hover{color:#d4a96a;border-color:#8a6a3a;}
.item a.del{cursor:pointer;color:#8a5a4a;border-color:#4a2a20;}
.item a.del:hover{color:#d9736c;border-color:#a8342e;}
.empty{font-size:13px;color:#6a5a40;padding:20px 4px;line-height:1.6;}
.footer{color:#4a3820;font-size:11px;letter-spacing:1px;margin-top:auto;padding:24px 0;}
</style>
</head>
<body>
<div class="header">
  <h1>Reports</h1>
  <a class="home-btn" href="/">&#8962; Home</a>
</div>
<div class="tools" id="tools"></div>
<div class="list" id="list"><div class="empty">Loading&hellip;</div></div>
<div class="footer">Papyrates Archive &mdash; Restricted Access</div>

<script src="/papyrates-auth.js"></script>
<script>
requireAuth('research');

const LABELS = { all: 'All', judge: 'Judge', claude: 'Claude', gpt: 'GPT', gemini: 'Gemini' };
let files = [], tab = 'all', q = '';

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

async function load() {
  const list = document.getElementById('list');
  try {
    const res = await fetch('/api/reports?list=1', { headers: { Authorization: 'Bearer ' + getPapyratesToken() } });
    if (res.status === 401) { clearPapyratesSession(); window.location.href = '/index.html'; return; }
    if (!res.ok) throw new Error(res.status);
    files = (await res.json()).files || [];
  } catch (e) { list.innerHTML = '<div class="empty">Could not load the report list.</div>'; return; }
  drawTools(); draw();
}

function drawTools() {
  const t = document.getElementById('tools');
  t.innerHTML = Object.keys(LABELS).map(function (k) {
    return '<button class="tab' + (k === tab ? ' on' : '') + '" data-k="' + k + '">' + LABELS[k] + '</button>';
  }).join('') + '<input class="search" id="q" placeholder="Search names&hellip;" value="' + esc(q) + '">';
  t.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { tab = b.dataset.k; drawTools(); draw(); }; });
  document.getElementById('q').oninput = function (e) { q = e.target.value; draw(); };
  if (q) { const i = document.getElementById('q'); i.focus(); i.setSelectionRange(q.length, q.length); }
}

function draw() {
  // group the .html / .log / .pdf that share a name into one row
  const groups = {};
  files.forEach(function (f) {
    if (tab !== 'all' && f.folder !== tab) return;
    const base = f.key.replace(/\.(html|log|pdf)$/, '');
    if (q && base.toLowerCase().indexOf(q.toLowerCase()) < 0) return;
    (groups[base] = groups[base] || { base: base, folder: f.folder, files: {}, at: f.updated_at }).files[f.key.split('.').pop()] = f;
  });
  const nm = function (g) { return g.base.replace(/^[a-z]+\//, ''); };
  // newest first: names start with the date; anything without one goes to the bottom
  const dated = function (g) { return /^\d{4}-\d{2}-\d{2}/.test(nm(g)) ? nm(g) : ''; };
  const rows = Object.values(groups).sort(function (a, b) {
    const da = dated(a), db = dated(b);
    if (da !== db) return da < db ? 1 : -1;
    return nm(a) < nm(b) ? 1 : -1;
  });
  const list = document.getElementById('list');
  if (!rows.length) {
    list.innerHTML = '<div class="empty">' + (files.length ? 'Nothing matches.' : 'No reports are in the cloud yet. The Desktop copies them over every couple of minutes &mdash; check back shortly.') + '</div>';
    return;
  }
  list.innerHTML = rows.map(function (g) {
    const name = g.base.replace(/^[a-z]+\//, '');
    const links = ['html', 'pdf', 'log'].filter(function (e) { return g.files[e]; }).map(function (e) {
      return '<a href="/report.html?f=' + encodeURIComponent(g.files[e].key) + '">' + (e === 'html' ? 'Open' : e === 'pdf' ? 'PDF' : 'Log') + '</a>';
    }).join('');
    const delLink = getPapyratesTier() === 'admin' ? '<a class="del" data-base="' + esc(g.base) + '">delete</a>' : '';
    return '<div class="item"><div class="t">' + esc(name) + '</div><span class="d">' + esc(LABELS[g.folder]) + '</span>' + links + delLink + '</div>';
  }).join('');
  list.querySelectorAll('a.del').forEach(function (a) { a.onclick = function () { deleteReport(a.getAttribute('data-base')); }; });
}

// admin only: removes the cloud copy of a report (its html / pdf / log). The original in OneDrive is not touched.
async function deleteReport(base) {
  const keys = files.filter(function (f) { return f.key.replace(/\.(html|log|pdf)$/, '') === base; }).map(function (f) { return f.key; });
  if (!keys.length) return;
  if (!confirm('Delete "' + base.replace(/^[a-z]+\//, '') + '" from the website?\n\nThis removes the cloud copy only. The original in OneDrive is not touched.')) return;
  try {
    for (const k of keys) {
      const res = await fetch('/api/reports?f=' + encodeURIComponent(k), { method: 'DELETE', headers: { Authorization: 'Bearer ' + getPapyratesToken() } });
      if (res.status === 401) { clearPapyratesSession(); window.location.href = '/index.html'; return; }
      if (!res.ok) throw new Error(res.status);
    }
  } catch (e) { alert('Could not delete it. Nothing more was changed.'); }
  load();
}
load();
</script>
</body>
</html>
