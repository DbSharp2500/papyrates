<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jim — Gemini Research</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:#0f0a1a;min-height:100vh;display:flex;flex-direction:column;}

.header{background:#1a0d2e;color:white;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #3a1a6a;}
.header-left h1{font-size:20px;font-weight:500;color:#d4aaff;}
.header-left p{font-size:13px;color:#9070c0;margin-top:2px;}
.header-btns{display:flex;gap:8px;align-items:center;}
.hbtn{background:rgba(168,85,247,0.15);color:#c084fc;border:1px solid rgba(168,85,247,0.4);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;}
.hbtn:hover{background:rgba(168,85,247,0.3);}
.hbtn.home{background:rgba(255,255,255,0.07);color:#aaa;border-color:rgba(255,255,255,0.2);}
.hbtn.home:hover{background:rgba(255,255,255,0.15);color:#fff;}

.chat-wrap{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px;max-width:900px;width:100%;margin:0 auto;}

.message{padding:16px 18px;border-radius:10px;line-height:1.7;font-size:14px;}
.message.user{background:#2d1a4a;color:#e0c8ff;align-self:flex-end;max-width:72%;border:1px solid #5a2a9a;}
.message.assistant{background:#1c1228;color:#ddd;box-shadow:0 2px 12px rgba(0,0,0,0.4);border:1px solid #2a1a4a;}
.message.assistant h1,.message.assistant h2,.message.assistant h3{color:#c084fc;margin:14px 0 6px;}
.message.assistant h1{font-size:17px;}
.message.assistant h2{font-size:15px;}
.message.assistant h3{font-size:14px;}
.message.assistant strong{color:#e0c8ff;}
.message.assistant a{color:#a855f7;text-decoration:underline;}
.message.assistant ul,.message.assistant ol{padding-left:20px;margin:8px 0;}
.message.assistant li{margin:4px 0;}
.message.assistant blockquote{border-left:3px solid #7c3aed;padding:8px 14px;background:#1a0d2e;color:#bbb;margin:10px 0;font-style:italic;}
.message.assistant table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;}
.message.assistant th{background:#2d1a4a;padding:8px 10px;text-align:left;font-size:12px;color:#c084fc;}
.message.assistant td{padding:8px 10px;border-bottom:1px solid #2a1a4a;color:#ccc;}
.message.assistant code{background:#0f0a1a;color:#c084fc;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:13px;}
.message.assistant pre{background:#0f0a1a;border:1px solid #2a1a4a;border-radius:6px;padding:12px;overflow-x:auto;margin:10px 0;}
.message.assistant pre code{background:none;padding:0;}
.message.system{background:#130820;color:#7050a0;font-size:12px;border:1px solid #2a1040;border-radius:6px;padding:8px 14px;align-self:center;text-align:center;}

.thinking{display:flex;gap:6px;align-items:center;padding:16px 18px;background:#1c1228;border-radius:10px;align-self:flex-start;border:1px solid #2a1a4a;}
.thinking span{color:#9070c0;font-size:13px;}
.dot{width:7px;height:7px;background:#7c3aed;border-radius:50%;animation:bounce 1.2s ease infinite;}
.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,80%,100%{transform:scale(0.3);}40%{transform:scale(1.0);}}

.input-area{background:#120820;padding:16px 24px;border-top:1px solid #2a1a4a;max-width:900px;width:100%;margin:0 auto;}
.input-row{display:flex;gap:10px;align-items:flex-end;}
.input-row textarea{flex:1;background:#1c1228;color:#e0c8ff;border:1px solid #3a1a6a;border-radius:8px;padding:12px;font-size:14px;resize:none;min-height:60px;max-height:200px;font-family:Arial,sans-serif;}
.input-row textarea::placeholder{color:#5a3a7a;}
.input-row textarea:focus{outline:none;border-color:#7c3aed;}
.send-btn{background:#5b21b6;color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap;height:48px;transition:background 0.15s;}
.send-btn:hover{background:#6d28d9;}
.send-btn:disabled{opacity:0.45;cursor:default;}
.hint{font-size:11px;color:#4a2a6a;margin-top:8px;text-align:center;}
.hint kbd{background:#1c1228;border:1px solid #3a1a6a;border-radius:3px;padding:1px 5px;color:#7050a0;}
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;min-height:100vh;">

  <div class="header">
    <div class="header-left">
      <h1>✦ Jim — Papyrates Research (Gemini)</h1>
      <p>Manuscript provenance specialist · Direct database access</p>
    </div>
    <div class="header-btns">
      <button class="hbtn" onclick="clearSession()">New Session</button>
      <a href="/" class="hbtn home">&#8592; Home</a>
    </div>
  </div>

  <div class="chat-wrap" id="chat"></div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder='Ask a research question… Type "done" when finished to save notes.' rows="2"
        onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
    <div class="hint">
      <kbd>Shift+Enter</kbd> for new line &nbsp;·&nbsp;
      Type <kbd>done</kbd> to trigger end-of-session save &nbsp;·&nbsp;
      Type <kbd>exit</kbd> to close
    </div>
  </div>

</div>

<script src="/papyrates-auth.js"></script>
<script>
// ── Auth check ─────────────────────────────────────────────────────────────────
const session = getPapyratesSession();
if (!session || session.tier === 'readonly') {
  window.location.href = '/';
}

// ── State ──────────────────────────────────────────────────────────────────────
let messages = [];       // Gemini conversation history
let sessionStarted = false;
let isLoading = false;

const chat  = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');

// ── Rendering ──────────────────────────────────────────────────────────────────
function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  if (role === 'assistant') {
    div.innerHTML = renderMarkdown(text);
  } else if (role === 'system') {
    div.textContent = text;
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function showThinking() {
  const div = document.createElement('div');
  div.className = 'thinking';
  div.id = 'thinking';
  div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div><span>Jim is thinking…</span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function hideThinking() {
  const t = document.getElementById('thinking');
  if (t) t.remove();
}

// ── Simple markdown renderer ───────────────────────────────────────────────────
function renderMarkdown(text) {
  // Escape HTML first (except we'll handle it selectively)
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Code blocks
  html = html.replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Links
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Horizontal rules
  html = html.replace(/^---+$/gm, '<hr style="border-color:#2a1a4a;margin:10px 0;">');
  // Unordered lists
  html = html.replace(/^[\*\-] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');
  // Ordered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Paragraphs (double newlines)
  html = html.replace(/\n\n+/g, '</p><p>');
  html = '<p>' + html + '</p>';
  // Single newlines within paragraphs
  html = html.replace(/(?<!>)\n(?!<)/g, '<br>');
  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');

  return html;
}

// ── API call ───────────────────────────────────────────────────────────────────
async function callJimGemini(userText, isFirstMessage) {
  // Add user message to history
  messages.push({ role: 'user', parts: [{ text: userText }] });

  const res = await fetch('/api/jim-gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages,
      loadStartup: isFirstMessage,
    }),
  });

  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'API error');

  // Update history with full server-side conversation (includes fn call turns)
  messages = data.messages;

  return data.text;
}

// ── Send message ───────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = input.value.trim();
  if (!text || isLoading) return;

  // Handle exit
  if (text.toLowerCase() === 'exit') {
    appendMessage('system', 'Session closed. Goodbye.');
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;
    return;
  }

  input.value = '';
  isLoading = true;
  sendBtn.disabled = true;

  appendMessage('user', text);
  showThinking();

  try {
    const isFirst = !sessionStarted;
    sessionStarted = true;

    const reply = await callJimGemini(
      isFirst
        ? 'Start the session. Introduce yourself as Jim, report the database state, and wait for the research question.'
        : text,
      isFirst
    );

    hideThinking();
    appendMessage('assistant', reply);

    // If user typed "done", the response is the end-of-session proposal
    // Just display it — the loop continues so they can approve items
    if (text.toLowerCase() === 'done') {
      appendMessage('system', 'Review Jim\'s proposals above, then tell him which items to save. Type "exit" when finished.');
    }
  } catch (err) {
    hideThinking();
    appendMessage('system', '⚠ Error: ' + err.message);
  }

  isLoading = false;
  sendBtn.disabled = false;
  input.focus();
}

// ── Keyboard handling ──────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── Session start on load ──────────────────────────────────────────────────────
window.addEventListener('load', () => {
  input.focus();
  // Trigger session start automatically
  startSession();
});

async function startSession() {
  isLoading = true;
  sendBtn.disabled = true;
  appendMessage('system', 'Loading database context and connecting to Gemini…');
  showThinking();

  try {
    const reply = await callJimGemini(
      'Start the session. Introduce yourself as Jim, report the database state ' +
      '(dossier counts, researcher corrections count, memory entries count), ' +
      'and wait for the research question.',
      true // loadStartup = true for first message
    );
    sessionStarted = true;
    hideThinking();
    // Remove the loading system message
    const sysMsg = chat.querySelector('.message.system');
    if (sysMsg) sysMsg.remove();
    appendMessage('assistant', reply);
  } catch (err) {
    hideThinking();
    appendMessage('system', '⚠ Could not connect: ' + err.message);
  }

  isLoading = false;
  sendBtn.disabled = false;
  input.focus();
}

// ── Clear session ──────────────────────────────────────────────────────────────
function clearSession() {
  if (!confirm('Start a new session? The current conversation will be cleared.')) return;
  messages = [];
  sessionStarted = false;
  chat.innerHTML = '';
  input.disabled = false;
  sendBtn.disabled = false;
  startSession();
}
</script>
</body>
</html>
